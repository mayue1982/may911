<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1080" viewBox="0 0 720 1080"><rect width="720" height="1080" rx="28" fill="#f8faf8"/><g font-family="Microsoft YaHei, sans-serif"><text x="54" y="66" fill="#087d9e" font-size="18" font-weight="bold">DAY 03 · 青岛东部海岸</text><text x="54" y="125" fill="#173b4c" font-size="36" font-weight="bold">从海洋馆，走向小麦岛日落</text><text x="54" y="170" fill="#526b75" font-size="18">游览顺序示意 · 非地理比例地图</text><path d="M85 240 L85 892" stroke="#8dc7cc" stroke-width="5" stroke-dasharray="8 8"/><rect x="124" y="220" width="544" height="126" rx="18" fill="white" stroke="#dcecee"/><circle cx="85" cy="270" r="25" fill="#087d9e"/><text x="85" y="278" text-anchor="middle" fill="white" font-size="22">1</text><text x="146" y="250" fill="#b96040" font-size="18">08:30</text><text x="146" y="285" fill="#173b4c" font-size="26" font-weight="bold">石老人海水浴场</text><text x="146" y="320" fill="#526b75" font-size="19">晨间看海、拍照，约 60 分钟</text><rect x="124" y="374" width="544" height="126" rx="18" fill="white" stroke="#dcecee"/><circle cx="85" cy="424" r="25" fill="#087d9e"/><text x="85" y="432" text-anchor="middle" fill="white" font-size="22">2</text><text x="146" y="404" fill="#b96040" font-size="18">10:00</text><text x="146" y="439" fill="#173b4c" font-size="26" font-weight="bold">青岛雕塑园</text><text x="146" y="474" fill="#526b75" font-size="19">散步约 60 分钟，之后先午餐</text><rect x="124" y="528" width="544" height="126" rx="18" fill="white" stroke="#dcecee"/><circle cx="85" cy="578" r="25" fill="#087d9e"/><text x="85" y="586" text-anchor="middle" fill="white" font-size="22">3</text><text x="146" y="558" fill="#b96040" font-size="18">12:00</text><text x="146" y="593" fill="#173b4c" font-size="26" font-weight="bold">青岛极地海洋公园</text><text x="146" y="628" fill="#526b75" font-size="19">东海东路 60 号，游览约 3 小时</text><rect x="124" y="682" width="544" height="126" rx="18" fill="white" stroke="#dcecee"/><circle cx="85" cy="732" r="25" fill="#087d9e"/><text x="85" y="740" text-anchor="middle" fill="white" font-size="22">4</text><text x="146" y="712" fill="#b96040" font-size="18">15:30</text><text x="146" y="747" fill="#173b4c" font-size="26" font-weight="bold">海之恋公园</text><text x="146" y="782" fill="#526b75" font-size="19">散步休息约 30-45 分钟</text><rect x="124" y="836" width="544" height="126" rx="18" fill="white" stroke="#dcecee"/><circle cx="85" cy="886" r="25" fill="#087d9e"/><text x="85" y="894" text-anchor="middle" fill="white" font-size="22">5</text><text x="146" y="866" fill="#b96040" font-size="18">日落前 45 分钟</text><text x="146" y="901" fill="#173b4c" font-size="26" font-weight="bold">小麦岛公园</text><text x="146" y="936" fill="#526b75" font-size="19">等日落、拍照，之后晚餐返程</text><text x="54" y="1040" fill="#526b75" font-size="17">按演出、天气与日落时间调整；转场可乘车，保留休息时间。</text></g></svg>