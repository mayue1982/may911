<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f5f8f7">
  <title>小麦岛 · AI 海边修图</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header><span class="brand-icon" aria-hidden="true">≈</span><h1>小麦岛 <span>AI 修图</span></h1></header>
    <section aria-label="照片上传与对比">
      <div class="section-head"><h2>你的海边照片</h2><button id="replace" class="text-button" hidden>换一张</button></div>
      <input id="file" type="file" accept="image/jpeg,image/png,image/webp" hidden>
      <button id="upload" class="upload"><span class="upload-icon" aria-hidden="true">＋</span><strong>上传照片</strong><small>JPG、PNG、WebP · 10 MB 内</small></button>
      <div id="preview" hidden>
        <div id="frame" class="frame"><img id="original" alt="上传的原始照片"><div id="afterLayer" class="after-layer" hidden><img id="result" alt="AI 优化后的照片"></div><div id="divider" class="divider" hidden><span>‹ ›</span></div><span class="image-label left">原图</span><span id="afterLabel" class="image-label right" hidden>修图后</span><input id="compare" type="range" min="0" max="100" value="50" aria-label="原图与修图后滑动对比" hidden></div>
        <p id="previewHint" class="hint" hidden>左右滑动对比，确认后保存</p>
      </div>
    </section>
    <fieldset><legend>选择修图模式</legend><div class="effects">
      <label class="effect"><input type="radio" name="effect" value="sky" checked><span class="effect-icon sky" aria-hidden="true">☀</span><strong>晴空蓝海</strong><span class="radio-mark"></span></label>
      <label class="effect"><input type="radio" name="effect" value="sunset"><span class="effect-icon sunset" aria-hidden="true">☼</span><strong>自然黄昏</strong><span class="radio-mark"></span></label>
    </div></fieldset>
    <button id="generate" class="primary" disabled>免费生成照片 ↗</button>
    <div id="status" role="status" aria-live="polite"></div>
    <div class="result-actions"><button id="download" class="secondary" hidden>保存修图照片 ↓</button><button id="cancel" class="text-button" hidden>取消生成</button></div>
    <details class="settings"><summary>照片处理与隐私说明</summary><p>点击生成会将照片发送至阿里云 AI 服务；每次生成发起一次请求。请仅上传你有权处理的照片，下载前确认人物与场景。本站代码不主动保存上传照片；云服务的数据处理以供应商政策为准。</p></details>
  </main>
  <script src="config.js"></script><script src="app.js"></script>
</body>
</html>
