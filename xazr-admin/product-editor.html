<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>商品编辑 · 心爱自然甄选</title>
  <style>
    :root{--blue:#0072bc;--deep:#005da8;--page:#f3f8fb;--ink:#17364b;--sub:#6f8290;--line:#dce8ef;--white:#fff;--red:#e65045;--shadow:0 12px 30px rgba(0,72,120,.09)}
    *{box-sizing:border-box}body{margin:0;background:var(--page);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}button,input,select,textarea{font:inherit}
    .top{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:15px 28px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.96);backdrop-filter:blur(12px)}
    .top-left{display:flex;align-items:center;gap:14px}.back{border:0;background:#eaf5fb;color:var(--blue);padding:10px 15px;border-radius:9px;font-weight:800;cursor:pointer}.top h1{margin:0;font-size:22px}.top p{margin:3px 0 0;color:var(--sub);font-size:12px}
    .save{border:0;border-radius:9px;background:var(--blue);color:#fff;padding:11px 24px;font-weight:900;cursor:pointer;box-shadow:0 8px 20px rgba(0,114,188,.2)}
    .layout{display:grid;grid-template-columns:minmax(620px,1fr) 390px;gap:20px;max-width:1440px;margin:0 auto;padding:22px}
    .editor{display:grid;gap:16px}.card{padding:22px;border:1px solid var(--line);border-radius:14px;background:#fff;box-shadow:var(--shadow)}.card h2{margin:0 0 18px;font-size:17px}.field{margin-bottom:15px}.field:last-child{margin-bottom:0}.field label{display:block;margin-bottom:7px;color:#526b7b;font-size:13px;font-weight:800}.field input,.field select,.field textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink);outline:none}.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(0,114,188,.08)}.field textarea{min-height:96px;resize:vertical;line-height:1.6}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.notice{padding:12px 14px;border:1px solid #cfe6f5;border-radius:9px;background:#edf7fc;color:#315f7a;font-size:12px;line-height:1.65}
    .toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:14px 0 10px}.btn{border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);padding:9px 14px;font-weight:800;cursor:pointer}.btn.blue{border-color:var(--blue);background:var(--blue);color:#fff}.dimension{margin-top:10px;padding:14px;border:1px solid var(--line);border-radius:11px;background:#fbfdfe}.dimension-row{display:grid;grid-template-columns:170px 1fr auto;gap:10px}.link{border:0;background:transparent;color:var(--blue);font-weight:800;cursor:pointer}.hint{margin-top:7px;color:var(--sub);font-size:12px}
    .sku-wrap{margin-top:14px;overflow:auto;border:1px solid var(--line);border-radius:10px}table{width:100%;min-width:650px;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid #edf3f6;text-align:left;font-size:13px}th{background:#f7fbfd;color:var(--sub)}td input,td select{width:100%;min-width:90px;padding:8px;border:1px solid var(--line);border-radius:7px}.combo{min-width:180px;font-weight:800}
    .uploads{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:12px}.image-card{position:relative;padding:7px;border:1px solid var(--line);border-radius:10px;background:#fff}.image-card img{width:100%;aspect-ratio:1;display:block;object-fit:cover;border-radius:7px;background:#eef5f8}.image-card button{width:100%;margin-top:6px;border:0;background:#fff0ef;color:var(--red);padding:6px;border-radius:6px;font-weight:700;cursor:pointer}.upload-state{margin-top:8px;color:var(--sub);font-size:12px}
    .preview-column{position:relative}.preview-sticky{position:sticky;top:92px}.preview-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.preview-title strong{font-size:15px}.phone{height:min(780px,calc(100vh - 125px));min-height:560px;display:flex;flex-direction:column;overflow:hidden;border:8px solid #17364b;border-radius:28px;background:#f5f5f5;box-shadow:0 24px 50px rgba(23,54,75,.2)}.phone-bar{flex:0 0 auto;padding:12px 16px;background:#0072bc;color:#fff;text-align:center;font-size:13px;font-weight:800}.phone-scroll{flex:1;min-height:0;overflow-y:auto;scrollbar-width:thin;scrollbar-color:#8fb9d1 #eaf2f6}.phone-scroll::-webkit-scrollbar{width:9px}.phone-scroll::-webkit-scrollbar-track{background:#eaf2f6}.phone-scroll::-webkit-scrollbar-thumb{border:2px solid #eaf2f6;border-radius:8px;background:#8fb9d1}.hero{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:#eaf2f6}.phone-body{padding:18px;background:#fff}.preview-name{font-size:18px;font-weight:900;line-height:1.35}.preview-desc{margin-top:6px;color:var(--sub);font-size:12px}.price{margin:14px 0;color:var(--red);font-size:27px;font-weight:900}.preview-group{margin-top:14px}.preview-label{margin-bottom:8px;color:#526b7b;font-size:12px;font-weight:800}.chips{display:flex;flex-wrap:wrap;gap:7px}.chip{padding:8px 11px;border:1px solid #d7e5ed;border-radius:7px;background:#f8fbfd;color:#526b7b;font-size:12px;cursor:pointer}.chip.active{border-color:var(--blue);background:#eaf6fc;color:var(--blue);font-weight:800}.chip.sold{opacity:.45}.preview-detail{margin-top:10px;padding:18px;background:#fff}.preview-detail h3{margin:0 0 12px;font-size:16px}.preview-detail-copy{white-space:pre-wrap;color:#526b7b;font-size:12px;line-height:1.7}.preview-detail img{display:block;width:100%;height:auto;margin-top:12px;border-radius:8px}.preview-end{padding:18px;color:#91a1ab;text-align:center;font-size:11px}.preview-actions{flex:0 0 auto;display:grid;grid-template-columns:1fr 1.25fr;gap:9px;padding:12px;background:#fff;border-top:1px solid #edf3f6}.preview-actions div{padding:11px;text-align:center;border-radius:22px;font-size:13px;font-weight:900}.cart{border:1px solid var(--blue);color:var(--blue)}.buy{background:var(--blue);color:#fff}.status{min-height:20px;color:var(--red);font-size:13px;text-align:right}
    @media(max-width:1050px){.layout{grid-template-columns:1fr}.preview-sticky{position:static}.preview-column{max-width:430px;width:100%;margin:0 auto}.top{padding:12px 16px}}
    @media(max-width:680px){.layout{padding:12px}.card{padding:16px}.grid2,.dimension-row{grid-template-columns:1fr}.uploads{grid-template-columns:repeat(2,1fr)}.top p{display:none}.top h1{font-size:18px}.save{padding:10px 15px}}
  </style>
</head>
<body>
  <header class="top"><div class="top-left"><button class="back" type="button" onclick="goBack()">← 商品列表</button><div><h1 id="pageTitle">新增商品</h1><p>独立编辑页面 · 通用规格 · 实时预览</p></div></div><div><div class="status" id="status"></div><button class="save" type="button" onclick="saveProduct()">保存商品</button></div></header>
  <main class="layout">
    <form class="editor" id="form" onsubmit="return false">
      <section class="card"><h2>基本信息</h2><input type="hidden" name="id"><div class="field"><label>商品名称</label><input name="name" required placeholder="请输入商品名称"></div><div class="grid2"><div class="field"><label>商品分类</label><select name="category"></select></div><div class="field"><label>单规格说明</label><input name="spec" placeholder="未启用多规格时填写，如 500g"></div></div><div class="grid2"><div class="field"><label>默认／最低售价</label><input name="price" type="number" min="0" step="0.01" required value="0"></div><div class="field"><label>默认／总库存</label><input name="stock" type="number" min="0" step="1" required value="0"></div></div><div class="field"><label>商品卖点</label><textarea name="desc" placeholder="列表页展示的简短卖点"></textarea></div><div class="field"><label>商品详情</label><textarea name="detail" placeholder="商品详细介绍"></textarea></div></section>
      <section class="card"><h2>通用多规格</h2><div class="notice">所有商品都可自行定义规格。点击“添加规格维度”，填写维度名称和可选值；系统自动生成组合，每个组合分别设置价格、库存和图片。未启用多规格时留空即可。</div><div class="toolbar"><strong>规格维度</strong><button class="btn blue" type="button" onclick="addGroup()">＋ 添加规格维度</button></div><div id="groups"></div><div id="skuArea"></div></section>
      <section class="card"><h2>商品图片</h2><div class="field"><label>商品主图（1–9张正方形图片）</label><input id="mainFiles" type="file" accept="image/png,image/jpeg,image/webp" multiple><div class="upload-state" id="mainState">第1张作为商品封面，也可指定给不同规格组合</div><div class="uploads" id="mainPreview"></div></div><div class="field"><label>商品详情图（最多12张，支持长图）</label><input id="detailFiles" type="file" accept="image/png,image/jpeg,image/webp" multiple><div class="upload-state" id="detailState"></div><div class="uploads" id="detailPreview"></div></div></section>
      <section class="card"><div class="grid2"><div class="field"><label>商品状态</label><select name="status"><option value="draft">草稿／下架</option><option value="published">已上架</option></select></div><div class="field"><label>&nbsp;</label><button class="save" style="width:100%" type="button" onclick="saveProduct()">保存商品</button></div></div></section>
    </form>
    <aside class="preview-column"><div class="preview-sticky"><div class="preview-title"><strong>小程序完整页面预览</strong><span class="hint">拖动右侧滑块上下查看</span></div><div class="phone"><div class="phone-bar">商品详情</div><div class="phone-scroll"><img class="hero" id="previewImage"><div class="phone-body"><div class="preview-name" id="previewName">商品名称</div><div class="preview-desc" id="previewDesc">商品卖点将在这里显示</div><div class="price" id="previewPrice">¥0.00</div><div id="previewGroups"></div></div><div class="preview-detail"><h3>商品介绍</h3><div class="preview-detail-copy" id="previewDetailText">商品详情将在这里显示</div><div id="previewDetailImages"></div></div><div class="preview-end">— 已经到底了 —</div></div><div class="preview-actions"><div class="cart">加入购物车</div><div class="buy">立即购买</div></div></div></div></aside>
  </main>
  <script src="config.js"></script>
  <script>
    const categories=["服装","食品","文创","百货","办公用品","电器","建材"],$=selector=>document.querySelector(selector),form=$("#form");
    let groups=[],skus=[],mainImages=[],detailImages=[],previewSelection={},productId=new URLSearchParams(location.search).get("id")||"";
    const config=()=>({url:(window.XAZR_ADMIN_CONFIG&&window.XAZR_ADMIN_CONFIG.apiUrl)||"",token:localStorage.getItem("xazr_session_token")||""});
    async function api(action,payload={}){const c=config();if(!c.url||!c.token)throw new Error("登录已失效，请返回后台重新登录");let response,lastError;for(let attempt=1;attempt<=3;attempt++){try{response=await fetch(c.url,{method:"POST",headers:{"content-type":"application/json","authorization":`Bearer ${c.token}`},body:JSON.stringify({action,...payload}),cache:"no-store"});break}catch(error){lastError=error;if(attempt<3)await new Promise(resolve=>setTimeout(resolve,attempt*700))}}if(!response)throw new Error("云后台暂时连接失败，已自动重试3次。请刷新页面；若仍失败，请检查网络或HTTP网关");let data;try{data=await response.json()}catch(error){throw new Error(`云后台返回异常（HTTP ${response.status}）`)}if(response.status===401){localStorage.removeItem("xazr_session_token");throw new Error("登录已失效，请返回商品列表重新登录")}if(!response.ok||!data.ok)throw new Error(data.error||`请求失败（HTTP ${response.status}）`);return data}
    const esc=value=>String(value??"").replace(/[&<>"']/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[char]));
    const makeId=prefix=>prefix+"-"+Date.now().toString(36)+"-"+Math.random().toString(36).slice(2,7);
    const optionKey=options=>Object.keys(options||{}).sort().map(key=>key+"="+options[key]).join("|");
    const combinations=items=>items.reduce((rows,group)=>rows.flatMap(row=>group.values.map(value=>({...row,[group.id]:value}))),[{}]);
    function setStatus(text,error=false){$("#status").textContent=text;$("#status").style.color=error?"#e65045":"#20a67a"}
    function readGroups(){groups=[...$("#groups").children].map(card=>({id:card.dataset.id,name:card.querySelector("[data-name]").value.trim(),values:[...new Set(card.querySelector("[data-values]").value.split(/[,，\n]/).map(value=>value.trim()).filter(Boolean))]}));return groups}
    function addGroup(group={}){if(groups.length>=5)return setStatus("最多设置5个规格维度",true);groups.push({id:group.id||makeId("g"),name:group.name||"",values:group.values||[]});renderGroups()}
    function removeGroup(id){const previous=readSkus();groups=groups.filter(group=>group.id!==id);renderGroups(previous)}
    function renderGroups(previous=skus){$("#groups").innerHTML=groups.map((group,index)=>`<div class="dimension" data-id="${group.id}"><div class="dimension-row"><input data-name placeholder="维度名称，如颜色、尺码、购买方式" value="${esc(group.name)}"><input data-values placeholder="可选值，用逗号分隔，如白色,黑色" value="${esc((group.values||[]).join(","))}"><button class="link" type="button" onclick="removeGroup('${group.id}')">删除</button></div><div class="hint">规格维度 ${index+1}：名称和值均可自行定义</div></div>`).join("");$("#groups").querySelectorAll("input").forEach(input=>input.onchange=()=>{const old=readSkus();readGroups();generateSkus(old)});generateSkus(previous);preview()}
    function generateSkus(previous=[]){const valid=groups.filter(group=>group.name&&group.values.length);if(!valid.length){skus=[];$("#skuArea").innerHTML="";preview();return}const all=combinations(valid);if(all.length>100){$("#skuArea").innerHTML='<div class="notice" style="margin-top:12px;color:#b33">规格组合超过100个，请减少规格值。</div>';setStatus("规格组合超过100个",true);return}const byKey=new Map(previous.map(sku=>[optionKey(sku.options),sku]));skus=all.map(options=>{const old=byKey.get(optionKey(options))||{};return {id:old.id||makeId("sku"),options,price:old.price??Number(form.elements.price.value||0),stock:old.stock??0,image:old.image||""}});renderSkuTable();syncTotals();preview()}
    function renderSkuTable(){if(!skus.length)return $("#skuArea").innerHTML="";$("#skuArea").innerHTML=`<div class="sku-wrap"><table><thead><tr><th>规格组合</th><th>售价</th><th>库存</th><th>展示图片</th></tr></thead><tbody>${skus.map((sku,index)=>`<tr data-index="${index}"><td class="combo">${groups.filter(g=>g.name&&g.values.length).map(g=>esc(sku.options[g.id])).join("／")}</td><td><input data-field="price" type="number" min="0.01" step="0.01" value="${sku.price}" required></td><td><input data-field="stock" type="number" min="0" step="1" value="${sku.stock}" required></td><td><select data-field="image"><option value="">使用商品封面</option>${mainImages.map((image,i)=>`<option value="${esc(image.fileID)}" ${sku.image===image.fileID?"selected":""}>主图 ${i+1}</option>`).join("")}</select></td></tr>`).join("")}</tbody></table></div>`;$("#skuArea").querySelectorAll("input,select").forEach(input=>input.oninput=()=>{const row=input.closest("tr"),sku=skus[Number(row.dataset.index)];sku[input.dataset.field]=input.value;syncTotals();preview()})}
    function readSkus(){document.querySelectorAll("#skuArea tbody tr").forEach(row=>{const sku=skus[Number(row.dataset.index)];row.querySelectorAll("[data-field]").forEach(input=>sku[input.dataset.field]=input.value)});return skus}
    function syncTotals(){if(!skus.length)return;form.elements.price.value=Math.min(...skus.map(sku=>Number(sku.price)||0));form.elements.stock.value=skus.reduce((sum,sku)=>sum+(Number(sku.stock)||0),0)}
    function selectPreview(groupId,value){previewSelection[groupId]=decodeURIComponent(value);preview()}
    function preview(){const valid=groups.filter(group=>group.name&&group.values.length);valid.forEach(group=>{if(!group.values.includes(previewSelection[group.id]))previewSelection[group.id]=group.values[0]});const selected=skus.find(sku=>valid.every(group=>sku.options&&sku.options[group.id]===previewSelection[group.id]))||skus.find(sku=>Number(sku.stock)>0)||skus[0];if(selected)valid.forEach(group=>previewSelection[group.id]=selected.options[group.id]);const name=form.elements.name.value.trim()||"商品名称",desc=form.elements.desc.value.trim()||"商品卖点将在这里显示",detail=form.elements.detail.value.trim()||"商品详情将在这里显示",price=selected?Number(selected.price||0):Number(form.elements.price.value||0),selectedImage=selected&&selected.image,previewImage=(selectedImage&&mainImages.find(image=>image.fileID===selectedImage))||mainImages[0];$("#previewName").textContent=name;$("#previewDesc").textContent=desc;$("#previewDetailText").textContent=detail;$("#previewPrice").textContent="¥"+price.toFixed(2);$("#previewImage").src=(previewImage&&previewImage.preview)||"";$("#previewDetailImages").innerHTML=detailImages.map(image=>`<img src="${esc(image.preview)}" alt="商品详情图">`).join("");$("#previewGroups").innerHTML=valid.map(group=>`<div class="preview-group"><div class="preview-label">${esc(group.name)}</div><div class="chips">${group.values.map(value=>{const candidate=skus.find(sku=>sku.options&&sku.options[group.id]===value&&valid.every(other=>other.id===group.id||sku.options[other.id]===previewSelection[other.id])),sold=!candidate||Number(candidate.stock)<=0;return `<button type="button" class="chip ${previewSelection[group.id]===value?"active":""} ${sold?"sold":""}" onclick="selectPreview('${group.id}','${encodeURIComponent(value)}')">${esc(value)}${sold?"（售罄）":""}</button>`}).join("")}</div></div>`).join("")}
    function renderImages(){$("#mainPreview").innerHTML=mainImages.map((image,index)=>`<div class="image-card"><img src="${image.preview}"><button type="button" onclick="removeImage('main',${index})">删除</button></div>`).join("");$("#detailPreview").innerHTML=detailImages.map((image,index)=>`<div class="image-card"><img src="${image.preview}"><button type="button" onclick="removeImage('detail',${index})">删除</button></div>`).join("");if(skus.length)renderSkuTable();preview()}
    function removeImage(type,index){(type==="main"?mainImages:detailImages).splice(index,1);renderImages()}
    async function prepare(file,square){if(file.size>12*1024*1024)throw new Error(file.name+" 超过12MB");const url=URL.createObjectURL(file);try{const img=await new Promise((resolve,reject)=>{const value=new Image();value.onload=()=>resolve(value);value.onerror=reject;value.src=url});if(square&&Math.abs(img.naturalWidth-img.naturalHeight)/Math.max(img.naturalWidth,img.naturalHeight)>.02)throw new Error(file.name+" 必须是1:1正方形");const max=square?1000:1400,scale=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight)),canvas=document.createElement("canvas");canvas.width=Math.round(img.naturalWidth*scale);canvas.height=Math.round(img.naturalHeight*scale);canvas.getContext("2d").drawImage(img,0,0,canvas.width,canvas.height);let quality=.82,data=canvas.toDataURL("image/jpeg",quality);while(data.length>420000&&quality>.34){quality-=.08;data=canvas.toDataURL("image/jpeg",quality)}return data}finally{URL.revokeObjectURL(url)}}
    async function uploadData(dataUrl,folder,onProgress){const comma=dataUrl.indexOf(","),mime=dataUrl.slice(5,dataUrl.indexOf(";")),base64=dataUrl.slice(comma+1),size=90000,total=Math.ceil(base64.length/size),uploadId=makeId("upload");let result;for(let index=0;index<total;index++){onProgress(index+1,total);result=await api("uploadImageChunk",{uploadId,index,total,chunk:base64.slice(index*size,(index+1)*size),mime,folder})}return result}
    async function uploadFiles(files,target,limit,folder,square,state){if(target.length+files.length>limit)throw new Error("最多上传"+limit+"张图片");for(let i=0;i<files.length;i++){state.textContent=`正在处理第 ${i+1}/${files.length} 张`;const data=await prepare(files[i],square);const result=await uploadData(data,folder,(part,total)=>state.textContent=`上传第 ${i+1}/${files.length} 张（${part}/${total}）`);target.push({fileID:result.fileID,preview:result.tempURL||data});renderImages()}state.textContent="图片上传完成"}
    async function saveProduct(){try{readGroups();readSkus();if(!form.reportValidity())return;if(!mainImages.length)throw new Error("请至少上传1张商品主图");if(groups.some(group=>!group.name||!group.values.length))throw new Error("请完整填写每个规格维度的名称和可选值");const capability=await api("me");if(groups.length&&Number(capability.schemaVersion)<2)throw new Error("云函数还是旧版本：请先部署 productAdmin，再保存多规格商品");const product={_id:form.elements.id.value,name:form.elements.name.value,category:form.elements.category.value,spec:form.elements.spec.value,price:Number(form.elements.price.value),stock:Number(form.elements.stock.value),desc:form.elements.desc.value,detail:form.elements.detail.value,image:mainImages[0].fileID,images:mainImages.map(i=>i.fileID),detailImages:detailImages.map(i=>i.fileID),specGroups:groups,skus,status:form.elements.status.value};setStatus("正在保存并校验…");const saved=await api("save",{product});if(groups.length&&(!saved.product||!Array.isArray(saved.product.specGroups)||saved.product.specGroups.length!==groups.length||!Array.isArray(saved.product.skus)||saved.product.skus.length!==skus.length))throw new Error("云端没有完整保存规格，请部署新版 productAdmin 云函数");const reloaded=await api("list"),stored=(reloaded.products||[]).find(item=>item._id===saved.id);if(!stored||(groups.length&&((stored.specGroups||[]).length!==groups.length||(stored.skus||[]).length!==skus.length)))throw new Error("保存后回读校验失败，规格未完整写入云数据库");setStatus("保存成功，规格已校验");setTimeout(()=>location.href="index.html",700)}catch(error){setStatus(error.message||"保存失败",true)}}
    function legacyGroups(items){return [["color","颜色/款式"],["size","尺码/型号"],["pack","购买方式/包装"]].filter(([key])=>items.some(s=>s[key])).map(([id,name])=>({id,name,values:[...new Set(items.map(s=>s[id]).filter(Boolean))]}))}
    function loadProduct(product){for(const name of ["id","name","category","spec","price","stock","desc","detail","status"])if(form.elements[name])form.elements[name].value=name==="id"?product._id:(product[name]??"");mainImages=(product.images&&product.images.length?product.images:[product.image]).filter(Boolean).map((fileID,index)=>({fileID,preview:(product.displayImages||[])[index]||product.displayImage||fileID}));detailImages=(product.detailImages||[]).map((fileID,index)=>({fileID,preview:(product.displayDetailImages||[])[index]||fileID}));groups=(product.specGroups&&product.specGroups.length?product.specGroups:legacyGroups(product.skus||[])).map(group=>({...group,values:[...(group.values||[])]}));skus=(product.skus||[]).map(sku=>({...sku,options:sku.options||Object.fromEntries(groups.map(group=>[group.id,sku[group.id]||""]))}));$("#pageTitle").textContent="编辑商品";renderImages();renderGroups(skus)}
    function goBack(){location.href="index.html"}
    form.elements.category.innerHTML=categories.map(category=>`<option>${category}</option>`).join("");form.querySelectorAll("input,textarea,select").forEach(input=>input.addEventListener("input",preview));
    $("#mainFiles").onchange=async event=>{try{await uploadFiles([...event.target.files],mainImages,9,"products",true,$("#mainState"))}catch(error){setStatus(error.message,true)}finally{event.target.value=""}};
    $("#detailFiles").onchange=async event=>{try{await uploadFiles([...event.target.files],detailImages,12,"products",false,$("#detailState"))}catch(error){setStatus(error.message,true)}finally{event.target.value=""}};
    (async()=>{try{const capability=await api("me");if(Number(capability.schemaVersion)<2)setStatus("云函数仍是旧版本：多规格保存前请先部署 productAdmin",true);if(productId){const data=await api("list"),product=(data.products||[]).find(item=>item._id===productId);if(!product)throw new Error("商品不存在");loadProduct(product)}else preview()}catch(error){setStatus(error.message,true)}})();
  </script>
