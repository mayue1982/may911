<script>
'use strict';
const COURSE = {"basePrompt": "我们正在用 WorkBuddy 筹办“心灵成长交流会”。\n已知：2026年10月30日，青岛，计划邀约约20人，需要线上线下推广。\n具体时间、地址、费用、名额上限、报名入口和联系方式待填写，是否同步线上参会未确定。\n我的需求补充：[粘贴填写的功能和界面清单；没有补充就写“无”]。\n本次十项成果：活动文档、学员表格、PPT、海报、话题抽签小游戏、推广文案、介绍网站、报名工具、经营看板、活动知识库。\n第一次使用时，请先创建00_项目基础，分别保存活动信息.md、功能需求.md、界面规范.md。\n活动信息只写已知事实与待填写项，功能需求记录本次十课范围，界面默认温暖自然；先给我简短方案确认。\n文件已经存在时先读取，不覆盖已确认内容。以后每次只完成我指定的一步。\n未知活动信息保留[待填写]，不要编造。邀约目标不等于报名人数或名额上限。\n在项目文件夹中实际保存作品，说明文件位置和打开方法。不能完成或未验证的内容如实说明。\n先展示方案，我确认后再制作。不自动发送消息或公开发布。", "visual": "本课作品统一采用温暖自然的活动视觉：米白背景#F7F5EF、深绿#355F50、深色正文，暖棕仅少量点缀。\n文档、PPT、海报、网页分别排版，不直接拉伸套版。\n手机正文建议16px及以上，常用按钮点击区域不小于44×44px；文字对比清楚。\n这套活动视觉与课程学习网页的蓝白界面是两套用途，不要求活动作品照搬学习网页。", "lessons": [{"id": 1, "title": "活动文档", "subtitle": "把想法写成能执行的方案", "category": "基础准备", "folder": "01_活动文档", "goal": "一份可在腾讯文档编辑的活动方案。", "materials": ["活动信息与功能清单", "界面风格选择；没有想法先用温暖自然"], "design": ["标题只放活动名称，下面用一行展示日期、城市与当前版本。", "正文按概况、流程、分工、物料排列；流程和分工用简表。", "标题分两级，段落控制在三四行，未知信息用[待填写]保留。"], "rules": ["实际信息、建议安排与待填写项分开。", "不编造场馆、嘉宾、价格和人数；录课时间不写成活动时间。"], "prompts": [["先定结构和排版", "design", "请读取项目基础资料，先为“心灵成长交流会”设计活动方案结构和排版。\n面向第一次组织活动的人，依次安排：活动概况、参与对象、建议流程、筹备分工、物料清单和会后跟进。\n标题下展示日期和城市；流程用“环节、时长、内容”三列，分工用“任务、负责人、完成时间”三列。\n使用两级标题、清晰的中文字体和适当留白，不加大封面、签字栏或装饰背景。\n先给目录和一个流程表样例，等我确认再写完整正文。"], ["再写方案并交付", "build", "按已确认的目录和排版生成内部筹备版活动方案。\n流程可建议为签到、开场、自愿交流、主题讨论、总结，但要标明是建议；时长和负责人未确认的先留空。\n主题、日期、城市从活动信息读取，邀约目标写约20人，不改成限额或已报名人数。\n保存Markdown和当前能够生成的可编辑Word文件到01_活动文档。\n同时给出适合粘贴到腾讯文档的正文。已授权且实际支持创建在线文档时才直接创建，否则说明手动导入方法。"], ["最后核对信息", "check", "核对这份活动方案的日期、城市、邀约目标和待填写项。\n检查流程是否前后衔接，负责人是否留有填写位置，建议是否被写成已确定事实。\n列出问题、位置和修改建议。打开或导入后我会检查排版，不要把未打开的文件称为已经验证。"]], "checks": ["活动事实正确，建议与未知项分清。", "正文与表格可编辑，腾讯文档中排版不乱。"], "exercise": "补齐一项真实信息，修改一个活动环节。", "teacher": "先展示零散笔记，再展示整理后的文档，突出“把想法说清楚”的变化。演示一次调整流程，检查没有连带改动日期。", "fault": "在线文档不能直接创建时，切到生成本地可编辑文件并手动导入，不在授权配置上占用主课时间。"}, {"id": 2, "title": "学员多维表格", "subtitle": "把邀约、报名与到场分开记录", "category": "基础准备", "folder": "02_学员表格", "goal": "一张能筛选的活动学员管理表。", "materials": ["上一课的活动方案", "8条虚构记录；不要拿真实名单练习"], "design": ["左侧优先显示称呼，后面依次放邀约、报名、到场状态。", "同一批记录设置全部、已报名、待联系、已到场四个视图。", "单选状态用少量统一颜色，备注列放到后面；联系方式只给工作人员看。"], "rules": ["邀约状态、报名状态、到场状态分别设字段。", "会前到场状态默认待核对，取消记录不计有效报名。"], "prompts": [["先设计表和视图", "design", "请为活动设计腾讯文档智能表的字段与视图，先不填写真实数据。\n字段：编号、称呼、联系方式、来源渠道、邀约状态、报名状态、到场状态、工作备注。\n说明字段类型和单选选项；联系方式使用文本。\n默认视图将称呼和状态放前面，备注放后面，避免列太宽。\n另外设计已报名、待联系、已到场视图，逐一写出筛选条件，全部指向同一批记录。\n状态颜色只辅助区分，同时保留文字；不把私人信息放到公开视图。\n先给字段与视图方案让我确认。"], ["再生成建表材料", "build", "按确认的表结构生成8条教学记录，称呼用演示学员01等，联系方式用演示文本，不生成真人手机号。\n包含不同邀约和报名状态，到场统一先为待核对。\n保存Excel、CSV和字段说明到02_学员表格，作为导入素材。\n另给腾讯文档字段、选项和视图的配置清单。导入普通Excel不代表智能表视图已经建好。\n当前有已授权、支持对应操作的连接时可以创建；否则由我手动设置，说明需要检查哪里。"], ["最后验证筛选", "check", "请给我三个简单验证步骤：修改一位演示学员为已报名、将一条报名取消、把一位学员改为已到场。\n分别说明哪个视图应该出现或移除该记录。\n核对编号、状态选项和联系方式格式，列出未验证的在线配置项。"]], "checks": ["修改状态后，相关视图的记录变化正确。", "虚构记录与真实名单分开，私人信息没有公开。"], "exercise": "改一条报名状态，再看已报名视图。", "teacher": "用一句话解释字段和视图：字段是记什么，视图是怎么看。演示改同一条记录，避免学员把四个视图建成四份名单。", "fault": "账号没有对应智能表能力时，先演示普通表格筛选，并明确视图配置属于后续能力，不能宣称已建成多维表。"}, {"id": 3, "title": "活动 PPT", "subtitle": "一页只讲一个重点", "category": "内容制作", "folder": "03_活动PPT", "goal": "一套现场可用、可编辑的8到10页PPT。", "materials": ["确认后的活动方案", "统一界面规范与必要图片"], "design": ["16:9，标题建议32—40pt，正文建议22—28pt，备注不放进正文。", "封面突出主题，流程用时间线，讨论页只放一个问题。", "每页不超过三个短要点，深色文字、简单图形，留出主持人备注。"], "rules": ["现场PPT面向参与者，不展示后台名单和内部筹备信息。", "不虚构嘉宾资质、效果或参与者故事。"], "prompts": [["先定逐页内容与视觉", "design", "按活动方案设计8到10页现场PPT，先给逐页大纲和视觉方案。\n内容包括欢迎、活动安排、交流约定、主题话题、自愿交流、行动记录、总结。\n使用16:9，温暖自然风格，标题建议32到40pt，正文建议22到28pt。\n封面只突出活动主题与必要日期地点；流程页用时间线；讨论页用一个大问题；结束页放真实后续联系方式或占位。\n每页最多三个短要点，避免满屏文字。列出每页标题、要点、画面形式和主持备注，等我确认。"], ["再制作可编辑文件", "build", "按确认大纲制作PPTX，保存到03_活动PPT。\n使用实际可用的中文字体，留足行距，保证现场投屏能看清。\n主持人提示放在备注中，正文不放完整讲稿。参与交流保持自愿，不要求披露私人经历。\n活动事实读取基础文件，缺失信息保留占位。\n输出可编辑文件并检查文字溢出、遮挡和页数；若不能生成PPTX，明确说明，不以图片或网页冒充可编辑PPT。"], ["最后调整一页", "check", "请检查全部页面的文字可读性和活动信息一致性。\n把交流约定页改成“自愿分享、尊重不同、不转述私人经历”三个短要点，其他页面不变。\n说明修改位置，并告诉我如何验证文件可编辑。没有实际预览到的页面标为未验证。"]], "checks": ["文件能打开、能编辑，现场文字大小合适。", "每页只有一个主旨，日期、地点与方案一致。"], "exercise": "修改一页标题和三个要点。", "teacher": "先确认逐页大纲，避免直接让AI做二十页。打开实际PPT改一处文字，展示这是可编辑作品。", "fault": "字体或图片效果异常时，先换通用可用字体、减少复杂装饰，重新检查，而非整套重做。"}, {"id": 4, "title": "活动海报", "subtitle": "先定文字，再做两种尺寸", "category": "内容制作", "folder": "04_活动海报", "goal": "一张竖版海报和一张横版宣传图。", "materials": ["准确的活动文案", "真实二维码或报名方式；没有就留位置"], "design": ["竖版1080×1440，横版1600×900，分别重新排版。", "从上到下突出主题、简短介绍、日期城市和报名方式。", "自然植物或光影作辅助，正文不压在复杂图片上；二维码周围留白。"], "rules": ["未知地址不编造，邀约20人不写成限额20人。", "不生成假二维码、不使用虚构现场照或虚构人物背书。"], "prompts": [["先定文案和构图", "design", "先为心灵成长交流会确定海报文字和布局，不直接出图。\n内容层级：主标题、简短副标题、活动日期与城市、确认过的参与说明、报名入口。\n采用米白背景、深绿标题、深色正文，植物或自然光作轻量背景，文字区保持干净。\n竖版1080×1440，横版1600×900，两版分别布局，不裁切拉伸。\n给三个克制的副标题供选，不承诺治疗或必然改变。\n缺失时间地址保留占位；没有真实二维码时只预留位置，先等我确认。"], ["再出图与源文件", "build", "按确认文案和构图制作两种尺寸海报，保存到04_活动海报。\n主题、日期、城市在手机缩小预览后仍清楚。二维码仅使用我提供的真实文件，保持图形完整并留白。\n如果直接生成的中文不准确，先做无字背景，再用清晰的可编辑文字排版。\n交付高清PNG和当前能生成的可编辑源文件，说明哪些元素可编辑。\n生成后逐字核对，不把只有图片的文件称为全可编辑。"], ["最后核对文字和扫码", "check", "逐字核对海报上的活动信息，检查错字、遮挡、图片拉伸和两种尺寸的裁切。\n没有真实二维码时标记为内部预览，不得对外使用。\n列出需要我用手机实际检查的项目：缩小后的文字、扫码结果、链接去向。不要声称已经完成你未执行的扫码测试。"]], "checks": ["中文无错字，日期和城市一眼可见。", "二维码使用真实素材并实测；两版没有拉伸。"], "exercise": "换一句副标题，保持视觉与事实不变。", "teacher": "演示先确认文案再出图，现场纠正一个小字过小的问题。横版是通用宣传素材，不承诺符合所有平台封面比例。", "fault": "AI图中文字出错时，采用背景加文字层的路线，不能靠反复抽图替代核对。"}, {"id": 5, "title": "话题抽签小游戏", "subtitle": "让现场交流从一个问题开始", "category": "互动应用", "folder": "05_话题抽签小游戏", "goal": "一个手机可操作、现场可投屏的话题抽签小游戏。", "materials": ["12条适合轻松交流的话题", "活动视觉规范；不需要登录或名单"], "design": ["顶部显示活动名称与“话题抽签”，中间一张大话题卡。", "主按钮“抽一个话题”，辅助按钮“换一题”“重新开始”，下方展示本轮剩余数量。", "题库编辑单独收起，投屏模式隐藏编辑区，放大话题和主要按钮。", "分别设计未抽取、抽取中、显示话题、题库为空、本轮抽完五种状态。"], "rules": ["每轮从未抽题中等概率随机抽一题；抽中即记为本轮已用，换一题也算抽过。", "本轮抽完后提示重新开始，不偷偷循环；重开本轮不删除题库。", "题库一行一题，去空白和完全重复项，编辑后明确重开一轮。", "刷新保留题库、当前题和本轮已抽记录，重置按钮不混同清空题库。"], "prompts": [["先设计游戏界面", "design", "请设计“心灵成长交流会·话题抽签”的界面，先给布局和状态方案，不写抽签逻辑。\n手机优先：顶部活动名称，中间大话题卡，主按钮“抽一个话题”，下方是“换一题”“重新开始”和“本轮剩余X题”。\n米白底、深绿色主按钮、少量植物气息；卡片话题字大、行距舒适，不做转盘和复杂装饰。\n主按钮点击区域至少44×44px，长话题可换行。\n题库编辑区默认收起，一行一题，保存时提示将重新开始本轮。\n设计未抽取、抽取中、显示结果、无题目、本轮抽完五种状态。抽取中禁用重复点击。\n提供投屏模式，放大题目并隐藏编辑区，可退出；不要求每台设备都支持浏览器全屏。\n固定提示“可以跳过，不必回答”。先让我确认界面。"], ["再实现不重复抽签", "build", "按确认UI，在05_话题抽签小游戏制作可本地打开的轻量网页游戏，优先不依赖联网和账号。\n预置12条轻松话题，如最近让你开心的小事、喜欢的放松方式、想试的一件小事。不要询问创伤或私人心理状况。\n每轮从未抽题中等概率随机抽取，抽中即计为已抽，换一题也占用一次，不重复出现。\n增加简短抽取反馈，结束后才允许再次操作；减少动态效果偏好下可直接显示结果。\n本轮抽完提示重新开始；重新开始仅清空本轮记录，保留题库。\n题库可编辑，去空白和完全重复行，保存新题库前提示会重开一轮；无题目时禁止抽取。\n用本地存储保留题库、当前题和已抽记录；读取失败时提示恢复默认题库，不能报错白屏。\n支持手机和投屏模式，不收集参与者信息，不自动记录回答。\n交付源文件、打开方法和检查清单。这个成品是网页小游戏，不声称是已发布微信小程序。"], ["最后用三题验收", "check", "先把教学副本题库设成三题，逐项实际检查：\n1. 连抽三次不重复，剩余数依次为2、1、0。\n2. 换一题也消耗本轮题目，抽取中连点不会多扣题。\n3. 抽完不能继续抽，重新开始后仍是三道题。\n4. 刷新后保留本轮已抽状态和当前题。\n5. 空白行、重复行和空题库处理正确，保存题库提示重开一轮。\n6. 长题目、窄屏、投屏和退出都能正常显示。\n输出通过、失败、未验证与具体证据，修复后复验。最后恢复12题正式教学题库，不覆盖我的自定义副本。"]], "checks": ["同轮不重复，剩余数准确，换题规则明确。", "题库能编辑，刷新不丢本轮状态，手机与投屏能读清。"], "exercise": "在副本里用三题测试，再加入自己的三道话题。", "teacher": "先投屏演示一局，让学员马上明白玩法。讲解先UI后逻辑：未抽题集合、抽中即移出、用完再重开。用三题比用十二题更容易现场验证。", "fault": "刷新丢记录时检查本地保存与读取；同轮重复时检查是否每次都从完整题库抽。不要通过把文字藏起来伪装“不重复”。"}, {"id": 6, "title": "推广文案", "subtitle": "同一份事实，写成不同渠道的内容", "category": "内容制作", "folder": "06_推广文案", "goal": "公众号文章、群通知和朋友圈文案。", "materials": ["活动资料、海报", "已确认的报名方式；没有就先做内部稿"], "design": ["公众号使用短段落、小标题，活动信息单独成块，末尾明确报名方式。", "群通知先放主题、时间地点，再放一句亮点与参与方式。", "朋友圈不复制长文章，配海报后只写自然的短邀请。"], "rules": ["同一渠道不用堆多个报名入口，不虚构人数、资质和评价。", "未知信息阻碍发布时先做内部稿，不自动群发。"], "prompts": [["先定文案版式", "design", "先为本活动规划公众号、群通知和朋友圈三种内容的结构与阅读版式。\n公众号依次为邀请开头、适合谁、交流内容、活动信息和报名方式，短段落、清楚小标题，不用大量花字和表情。\n群通知优先让人快速看到主题、时间地点和报名方式。\n朋友圈保留一句真实邀请和两三条必要信息，配合海报，不照搬全文。\n先给各渠道开头和结构供我选择，不编造现场故事。"], ["再写三种文案", "build", "按确认结构写公众号约600字、群通知约150字、朋友圈三条各约80字。\n只使用已确认活动信息，语气温暖、具体，像邀请朋友。\n不承诺治疗或必然改变，不制造名额紧张，不使用虚构评价。\n报名入口未定时标记内部预览，并列出发布缺项。\n保存Markdown和适合粘贴的正文到06_推广文案，不自动发送或发布。"], ["最后改掉广告腔", "check", "核对三种文案的时间地点、费用和报名方式一致。\n将空泛形容词改成具体活动内容，删除“改变人生”“彻底疗愈”等承诺。\n输出一个简短自然的邀请版本，并列出仍需补齐的信息。"]], "checks": ["各渠道信息一致，报名方式清楚。", "没有未经证实的背书、评价或效果承诺。"], "exercise": "把一条朋友圈文案改成自己的日常语气。", "teacher": "把长文章和群通知并排看，突出“同一事实、不同表达”。展示一次删广告腔，不需要扩展成长篇写作理论。", "fault": "出现凭空编造的活动细节时，返回统一信息文件，要求只重写相关段落。"}, {"id": 7, "title": "活动介绍网站", "subtitle": "让参与者一页看懂并找到报名", "category": "互动应用", "folder": "07_活动网站", "goal": "一个手机优先、内容清楚的活动介绍页。", "materials": ["已确认活动信息、海报、文案", "真实报名链接；未有时用准备中状态"], "design": ["手机单列：主题首屏、活动介绍、适合谁、流程、时间地点、常见问题、报名区。", "首屏不堆大段文字；日期城市紧邻标题，主按钮“了解并报名”。", "桌面可分栏，手机正文16px以上，内容边距至少约20px，按钮易点。", "底部报名按钮如固定，必须给正文留空，不遮住最后一段。"], "rules": ["一个主报名路径，没有真实入口时按钮不可假跳转。", "地点未知不放假地图，没有嘉宾就不加虚构嘉宾区。", "本地预览与公网发布分开，发布后在另一台设备验证。"], "prompts": [["先设计网站UI", "design", "为心灵成长交流会设计手机优先的单页网站UI，先输出布局方案和关键页面预览。\n首屏：活动主标题、简短说明、日期与青岛、主按钮“了解并报名”，辅助信息少而清楚。\n下方依次是活动介绍、适合谁、交流安排、时间地点、常见问题与报名区；没有嘉宾资料就省略嘉宾区。\n使用活动的米白、深绿视觉，正文至少16px，手机左右留足边距，卡片不层层嵌套。\n活动介绍可配真实海报，日期地点用紧凑信息行，不把所有文字放到海报图片里。\n按钮和链接有清晰悬停及键盘焦点，手机点按区域至少44×44px。\n报名入口未知时显示“报名入口准备中”；未定地点保留占位，不造假地图。\n手机底部如有固定报名按钮，给内容预留底部空间。先等我确认再实现。"], ["再生成网站功能", "build", "按确认UI制作轻量活动单页，保存到07_活动网站。\n使用当前环境最容易运行的实现方式，不为一个页面增加不必要的账号和依赖。\n目录能定位到对应内容，长FAQ可展开；报名按钮接我提供的真实链接，没有链接就保持准备中。\n所有文案来自已确认材料，替代文字、表单标签和键盘操作齐全，不自动播放音乐。\n检查手机和电脑布局，交付源文件、本地运行方法和公开发布所需条件。\n网站预览不等于已发布；尚未部署时不要返回虚构公网地址。"], ["最后测试页面和链接", "check", "检查320px、390px和桌面宽度：是否横向溢出、标题遮挡、按钮挡住正文。\n逐个检查目录跳转、FAQ展开与报名链接，确认准备中状态不假装可报名。\n核对活动事实，没有真实地址时不显示虚构地图。\n区分实际运行测试和只阅读代码的检查；公开发布后还要由我用另一设备访问，未做的标未验证。"]], "checks": ["手机没有横向溢出，主题日期与报名入口容易找到。", "链接真实有效，知道本地预览还不等于公开上线。"], "exercise": "只改介绍区域的一段文字，复查按钮位置。", "teacher": "先画内容顺序再看预览，演示把报名按钮从不显眼改到首屏。没有发布条件时，完成本地预览和发布说明即可，不做假上线。", "fault": "手机布局溢出先检查固定宽度、长链接和图片比例；按钮失效先核对真实链接和状态，不直接加假表单。"}, {"id": 8, "title": "简易报名工具", "subtitle": "表单清楚，更要确认报名真的收到", "category": "互动应用", "folder": "08_报名工具", "goal": "一个清楚的报名界面，以及已验证的真实收集入口。", "materials": ["活动信息与报名规则", "主办方选择的联系方式字段、腾讯文档收集能力"], "design": ["顶部简短活动信息，表单只保留称呼、一个必要联系方式和选填备注。", "标签放输入框上方，必填项标记清楚；错误贴近对应字段。", "主按钮“提交报名”，下方说明信息用途，不在公开页展示名单。", "设计填写中、校验错误、提交中、成功、失败和已截止状态。"], "rules": ["先确定提交到哪里；仅本地保存不得称为真实收到报名。", "收集入口真实可用后再接网站；多人规则由服务端或平台能力保障。", "不收集私密心理经历。20人是邀约目标，名额与截止时间需另行确认。"], "prompts": [["先设计报名UI", "design", "请设计活动报名页UI，先只给页面布局和状态方案。\n手机单列，顶部为活动主题、日期城市和返回介绍入口；中间为表单；底部是用途说明与主按钮“提交报名”。\n表单只收称呼、一个必要联系方式和选填备注。联系方式类型从已确认需求读取，没确定先问我，不强制同时收手机号和微信。\n米白背景、深绿主按钮、圆角输入框，标签位于框上方，必填与选填明确，正文建议16px及以上。\n错误信息紧邻字段，不只靠红色；键盘打开后仍能滚动操作。\n设计填写、校验错误、提交中、成功、网络失败、报名截止六种状态。提交中禁用重复提交，失败保留填写内容。\n成功页显示明确结果和后续安排，不显示其他人名单。只有真实收到记录才用“已收到报名”；名额未确认不写“报名已确认”。\n先预览UI，等我确认。"], ["再接真实收集入口", "build", "按确认字段建立真实报名收集流程，优先使用当前腾讯文档账号支持的收集能力。\n有已授权且支持创建的连接才直接配置，否则提供字段、选项、必填和权限设置清单，由我手动建立。\n标准平台表单外观按平台可配置范围设置，不承诺完整复刻自定义UI。\n自定义页面如尚未接通真实保存，必须标记教学演示，不能显示真实报名成功。\n我提供真实入口后，更新活动网站报名按钮，并让我提交一条标记为测试的虚构记录，再核对后台收到。\n截止时间、重复判断和名额上限由我确认；平台做不到自动控制时说明人工核对流程。\n源文件、设置说明与正式使用还缺什么，保存到08_报名工具。不把网页称作已发布微信小程序。"], ["最后走通一次报名", "check", "给我一份现场可执行的测试表：空必填、错误格式、正常提交、重复点击、网络失败、截止状态、后台查看与无权限访问。\n每项写操作、预期与实际结果；平台不支持控制的规则如实标注。\n核对测试记录在后台出现，普通参与者不能读取全体名单。\n失败不得假提示成功，取消或测试记录后续统计要排除。\n对没接后端的本地UI，只验证界面，不宣称真实报名链路已完成。"]], "checks": ["测试报名在后台可查，成功提示与真实状态一致。", "错误有说明，普通人看不到他人联系方式。"], "exercise": "从活动网站进入，提交虚构测试记录，再到后台核对。", "teacher": "先展示完整六种状态，再解释实际收集路线。自定义UI设计属于课堂技能，真实活动可用平台表单承接，明确平台主题能改到什么程度。", "fault": "平台界面无法完全复刻时，优先保证字段与收集链路，不擅自承诺技术能力；后端未完成时明确演示状态。"}, {"id": 9, "title": "活动经营看板", "subtitle": "先算对，再看清", "category": "数据复用", "folder": "09_经营看板", "goal": "一页能核对来源的活动统计看板。", "materials": ["最新名单导出数据", "真实与演示记录的标识、统一统计口径"], "design": ["顶部活动名称、数据更新时间与“手动更新”说明。", "第一行放邀约目标、实际邀约、有效报名、实际到场，目标与实际分组标注。", "下方放渠道报名柱状图和报名到场率；手机纵向排列，图表不只靠颜色。", "空数据、导入失败、会前未统计都有文字说明，不拿0充当未知。"], "rules": ["剔除测试、取消与重复报名，未知渠道单独归类。", "到场率分子只统计有效报名者中到场的人；分母为0显示暂无数据。", "不把所有报名数除以邀约数当邀约转化率，不虚构收入与满意度。"], "prompts": [["先设计看板UI", "design", "为心灵成长交流会设计一页活动看板，先给布局和空数据样稿。\n顶部展示活动名、数据导出时间及“手动更新”；第一行用简洁指标区展示邀约目标、实际邀约、有效报名、实际到场。\n邀约目标约20人单独标“计划”，不要混成已完成数字。\n下方左侧为渠道报名柱状图，右侧为到场率与统计说明；手机改成单列，数字、单位和图例都清楚。\n沿用活动深绿与米白风格，图表标数值，正文不依赖颜色理解。\n没有数据用说明文字，活动未结束到场显示“尚未统计”，没有来源不画假趋势。\n有CSV导入时设计选择文件、读取失败、字段缺失和替换数据后的状态。先等我确认。"], ["再统计并生成看板", "build", "读取活动表导出数据，先检查字段、重复、取消和测试记录，再生成看板，保存到09_经营看板。\n有效报名排除取消、测试和重复；实际邀约按已完成联系的去重人数；到场率=有效报名者中实际到场人数÷有效报名人数。\n分母为0显示暂无数据，缺失到场信息不判为未到场。渠道缺失归入未知。\n给出逐项统计明细和计算口径，与看板数字对应。\n本版使用导出文件手动更新，不声称实时同步。会后教学模拟单独存一份并明显标注，不覆盖真实数据。\n不展示个人联系方式，不生成无依据的收入、满意度和折线走势。"], ["最后核对统计", "check", "手动核对实际邀约、有效报名和到场率三个指标，显示用到的去重记录与排除原因，不公开个人联系方式。\n检查空文件、缺字段、0报名、未结束活动、未知来源和教学模拟标记。\n如支持文件导入，验证替换数据后所有指标和图表一起更新，不残留旧数字。\n写清通过、失败、未验证，不能用目标20人填补缺失的实际数据。"]], "checks": ["数字能与明细核对，测试记录未混入。", "手机图表可读，目标、真实与模拟数据分清。"], "exercise": "改一条演示状态，重新导出并观察统计变化。", "teacher": "先讲统计口径，后展示图表。会前可以制作结构与模拟练习，但真实到场必须活动后核对。演示一个取消报名如何影响统计。", "fault": "发现到场率超过100%或名单与看板不符，先核对分母、重复与测试记录，不能只修饰展示数字。"}, {"id": 10, "title": "活动知识库", "subtitle": "把这次成果留给下一次用", "category": "数据复用", "folder": "10_活动知识库", "goal": "一套能找资料、查答案、换活动的复用模板。", "materials": ["前九课的最终文件", "活动信息、真实复盘或空白复盘模板"], "design": ["首页先放资料目录，按方案、名单模板、PPT海报、小游戏、网站报名、复盘分类。", "每份资料记录名称、用途、原文件位置和版本，FAQ一问一答。", "公开包只放匿名与可分享材料，名单原件独立保管，不复制进公开目录。"], "rules": ["先整理与建索引，不删除或批量覆盖源文件。", "问答有文件依据，活动未结束不编造反馈与复盘结论。"], "prompts": [["先设计知识库目录", "design", "请为本活动知识库设计易读的目录和页面结构，先给计划。\n分为活动信息、筹备方案、表格模板、PPT与海报、话题抽签游戏、推广网站与报名、统计复盘。\n首页用简明目录，资料条目写名称、用途、原文件位置、最终或草稿状态；FAQ用一问一答，不做复杂管理系统。\n公开资料不包含真实联系方式和私人跟进备注，内部资料另存并限制访问。\n不删除源文件，不替我公开分享。先让我确认分类。"], ["再整理资料和模板", "build", "按确认分类，在10_活动知识库生成总索引、常见问题、复盘模板和下次活动替换清单。\n索引覆盖前九课，包含小游戏的题库与运行说明。\n常见问题只引用活动信息和已确认文档，答案附文件与小节；未知内容写尚未确定。\n活动未结束时只生成复盘模板，不编造参与者评价和效果。\n下次替换清单包括主题、日期、场地、参与方式、费用、名额、入口、海报与题库。\n不把查阅本地文件称为已经部署独立智能知识平台。"], ["最后用问题检索", "check", "请只根据项目资料回答：具体场地确定了吗？约20人指什么？是否同步线上参会？小游戏如何重开一轮？\n每个回答给出文件依据，资料没有说明就说没有说明。\n同时检查索引链接、最终版本标识，以及公开资料是否含真实联系方式。"]], "checks": ["资料索引能找到文件，问题回答有来源。", "未知信息不乱答，公开版本没有内部个人资料。"], "exercise": "为下一场活动写出五项需要替换的信息。", "teacher": "用一个确定问题和一个未知问题现场检索，展示知道与不知道都要有依据。最后复制活动替换清单，让课程落在复用能力上。", "fault": "资料问答开始猜测时，限定只检索当前文件，并要求逐条给依据；原始文件失效时先修复链接。"}], "topics": ["最近哪件小事让你开心？", "你喜欢用什么方式放松？", "你想尝试的一件小事是什么？", "哪一种日常习惯对你有帮助？", "你喜欢一天中的哪个时刻？", "最近你想感谢自己什么？", "哪一个地方让你觉得舒服？", "你喜欢怎样度过一个空闲下午？", "你最近发现了什么有趣的事？", "你愿意推荐一本书或一首歌吗？", "下周你想给自己留出怎样的时间？", "最近一次被理解是什么感觉？可以跳过。"]};

 '<section class="intro-section"><h2>先说清这两件事</h2><div class="prep-grid"><div><h3>功能需求</h3><ul class="field-list">'+['给谁使用','解决什么问题','最需要哪些功能','这次先不做什么','怎样算做完'].map(x=>'<li><span>'+x+'</span><span class="field-line" aria-hidden="true"></span></li>').join('')+'</ul></div><div><h3>界面需求</h3><ul class="field-list">'+['喜欢的风格与颜色','参考图片或作品','最想突出的信息','主要使用的设备','成功失败如何提示'].map(x=>'<li><span>'+x+'</span><span class="field-line" aria-hidden="true"></span></li>').join('')+'</ul></div></div><p class="intro-help" style="margin-top:16px">在自己的文档里填写，再交给 WorkBuddy。设计细节可以采用默认方案，活动事实和关键规则要自己确认。</p></section>'+ 
 '<div class="notice"><p>具体时间、场地、费用和报名入口待补；是否同步线上参会还未确定。“邀约约20人”不代表已经报名20人，也不代表限额20人。</p></div>'+ 
 '<section class="intro-section"><h2>在 WorkBuddy 中开始</h2><p class="muted">选择“心灵成长交流会_练习”文件夹，替换提示词中的需求补充再发送。先让它创建活动信息、功能需求、界面规范三份基础文件，确认后再进入第一课。</p>'+promptBlock('项目开场提示词',COURSE.basePrompt,'base-prompt')+'<details class="design-notes"><summary>活动作品采用什么风格？</summary><p class="muted">'+esc(COURSE.visual).replace(/\n/g,'<br>')+'</p></details></section>'+ 
 '<div class="start-row"><button class="primary" data-go="lesson-1" type="button">开始第1课：活动文档</button></div>';
}
function renderPrompt(lesson,index){
 const p=lesson.prompts[index];
 document.getElementById('prompt-title').textContent=p[0];
 document.getElementById('lesson-prompt').textContent=p[2];
 document.getElementById('step-note').textContent=stageNotes[index];
 document.querySelectorAll('.step-tab').forEach((b,i)=>{const selected=i===index;b.setAttribute('aria-selected',String(selected));b.tabIndex=selected?0:-1;});
 document.getElementById('prompt-panel').setAttribute('aria-labelledby','step-'+index);
}
function lessonScreen(lesson){
 const n=lesson.id;
 main.innerHTML='<div class="breadcrumb"><a href="#intro">活动实战</a><span>/</span><span>第'+n+'课</span></div><header class="screen-head"><div class="page-meta"><span>'+esc(lesson.category)+'</span><span>三步完成本课</span></div><h1 class="lesson-title">'+esc(lesson.title)+'</h1><p>'+esc(lesson.subtitle)+'</p></header>'+ 
 '<div class="lesson-brief"><div><span class="brief-label">本课成果</span><p>'+esc(lesson.goal)+'</p></div><div><span class="brief-label">开始前准备</span>'+list(lesson.materials)+'</div></div>'+ 
 '<details class="design-notes" open><summary>页面或排版要做成这样</summary>'+list(lesson.design)+'</details>'+ 
 '<div class="stepbar" role="tablist" aria-label="本课制作步骤">'+stageNames.map((s,i)=>'<button type="button" class="step-tab" role="tab" id="step-'+i+'" aria-controls="prompt-panel" aria-selected="'+(i===stage)+'" tabindex="'+(i===stage?0:-1)+'" data-stage="'+i+'"><span class="step-count">'+(i+1)+'</span>'+s+'</button>').join('')+'</div>'+ 
 '<section class="prompt-sheet" id="prompt-panel" role="tabpanel" aria-labelledby="step-'+stage+'"><div class="prompt-head"><h3 id="prompt-title"></h3><button class="copy-btn" type="button" data-copy="lesson-prompt">复制这段提示词</button></div><pre><code id="lesson-prompt"></code></pre><p class="step-note" id="step-note"></p></section>'+ 
 (n===5?'<details class="topic-samples"><summary>查看12条示例话题</summary><ol>'+COURSE.topics.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ol><p class="muted">先用三题副本检查规则，再恢复完整题库。每道题都可以跳过。</p></details>':'')+ 
 '<section class="finish-area"><div><h2>做完检查</h2>'+list(lesson.checks)+'</div><div><h2>一个小练习</h2><p>'+esc(lesson.exercise)+'</p></div></section>'+ 
 '<div class="complete-row"><label class="complete-control"><input id="lesson-complete" type="checkbox" '+(completed.has(n)?'checked':'')+'>我已完成本课练习</label><div class="page-controls"><button class="secondary" type="button" data-go="'+(n===1?'intro':'lesson-'+(n-1))+'">'+(n===1?'回到准备':'上一课')+'</button><button class="primary" type="button" data-go="'+(n===10?'tools':'lesson-'+(n+1))+'">'+(n===10?'常用修改提示词':'下一课')+'</button></div></div><p class="storage-note" id="storage-note">'+(storageAvailable?'勾选只记录本机学习进度，不代表作品已经通过验收。':'当前无法保存本机进度，勾选仅在本次打开期间有效。')+'</p>';
 renderPrompt(lesson,stage);
}
function tools(){
 const edits='请只修改[具体页面或位置]。\n现在的问题：[具体描述]。\n希望改成：[明确结果]。\n其他已确认内容保持原样。改完说明修改位置，并复查相关操作。';
 const simplify='请把当前任务简化成第一版，只保留[必须内容]。\n现在只完成[本次任务]，其他功能以后再加。\n先给简短方案让我确认，用新手能理解的话说明下一步。';
 const change='活动信息从[旧内容]改为[新内容]。\n先更新00_项目基础，再列出受影响的文档、PPT、海报、游戏标题、文案、网站和报名说明。\n能修改的逐项更新，不能直接改的在线内容列出手动操作位置，不假装已经发布。';
 main.innerHTML='<div class="breadcrumb"><a href="#intro">活动实战</a><span>/</span><span>常用提示词</span></div><header class="screen-head"><h1>遇到问题，接着这样问</h1><p class="tool-intro">不用推倒重来。说清问题的位置、期待的结果，以及这次只改哪里。</p></header><section class="tools-block"><h2>只改一处</h2>'+promptBlock('局部修改',edits,'tool-edit')+'</section><section class="tools-block"><h2>做得太复杂</h2>'+promptBlock('缩小第一版范围',simplify,'tool-simple')+'</section><section class="tools-block"><h2>活动信息变了</h2>'+promptBlock('同步修改资料',change,'tool-change')+'</section><section class="intro-section"><h2>发布前，再核对五件事</h2>'+list(['活动信息准确，没有待补事实被编造。','文件能打开，主要内容可以修改。','链接与二维码实际有效。','真实报名确实能收到。','公开成果没有内部名单和个人联系方式。'])+'</section><div class="start-row"><button class="secondary" type="button" data-go="lesson-10">回到第10课</button></div>';
}
function route(shouldScroll=true){
 let key=location.hash.replace(/^#/,'')||'intro';
 if(!['intro','tools',...LESSONS.map(x=>'lesson-'+x.id)].includes(key))key='intro';
 current=key;stage=0;updateNav();
 if(key==='intro')intro();else if(key==='tools')tools();else lessonScreen(LESSONS.find(x=>'lesson-'+x.id===key));
 document.title=(key.startsWith('lesson-')?LESSONS.find(x=>'lesson-'+x.id===key).title+' | ':'')+'WorkBuddy 活动实战 学员手册';
 if(shouldScroll){window.scrollTo({top:0,behavior:'instant'});main.focus({preventScroll:true});}
}
async function copyText(key){
 const source=document.getElementById(key);if(!source)return;
 try{await navigator.clipboard.writeText(source.textContent);showToast('已复制，粘贴到 WorkBuddy 即可');}
 catch(error){const range=document.createRange();range.selectNodeContents(source);const selection=window.getSelection();selection.removeAllRanges();selection.addRange(range);showToast('提示词已选中，请按 Ctrl+C 或长按复制');}
}
document.addEventListener('click',event=>{const copy=event.target.closest('[data-copy]');if(copy){copyText(copy.dataset.copy);return;}const go=event.target.closest('[data-go]');if(go){location.hash=go.dataset.go;return;}const step=event.target.closest('[data-stage]');if(step){stage=Number(step.dataset.stage);renderPrompt(LESSONS.find(x=>'lesson-'+x.id===current),stage);}});
document.addEventListener('keydown',event=>{const tab=event.target.closest('[data-stage]');if(!tab)return;if(!['ArrowRight','ArrowLeft','Home','End'].includes(event.key))return;event.preventDefault();const next=event.key==='Home'?0:event.key==='End'?2:(Number(tab.dataset.stage)+(event.key==='ArrowRight'?1:2))%3;stage=next;renderPrompt(LESSONS.find(x=>'lesson-'+x.id===current),stage);document.getElementById('step-'+stage).focus();});
document.addEventListener('change',event=>{if(event.target===mobile){location.hash=mobile.value;return;}if(event.target.id==='lesson-complete'){const n=Number(current.split('-')[1]);if(event.target.checked)completed.add(n);else completed.delete(n);try{localStorage.setItem(storeKey,JSON.stringify([...completed]));}catch(error){storageAvailable=false;document.getElementById('storage-note').textContent='当前无法保存本机进度，勾选仅在本次打开期间有效。';}updateNav();}});
window.addEventListener('hashchange',()=>route());
route(false);
</script>
</body>
</html>
